name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
          SHEETS_SPREADSHEET_ID: ${{ vars.SHEETS_SPREADSHEET_ID || '1iXp8DSMCMPLNetwaKVFvJHewNphHkwI3CC654hEKgNM' }}
          SHEETS_WORKSHEET: ${{ vars.SHEETS_WORKSHEET || 'Trang tính1' }}
        run: |
          if [ -z "$SHEETS_API_KEY" ] || [ -z "$SHEETS_SPREADSHEET_ID" ]; then
            echo "Set the SHEETS_API_KEY repository secret."
            exit 1
          fi
          mkdir dist
          cp index.html app.js styles.css dist/
          python -c 'import json, os, pathlib; config = {"apiKey": os.environ["SHEETS_API_KEY"], "spreadsheetId": os.environ["SHEETS_SPREADSHEET_ID"], "worksheet": os.environ.get("SHEETS_WORKSHEET") or "Trang tính1"}; pathlib.Path("dist/config.js").write_text("window.SHEET_LOOKUP_CONFIG = " + json.dumps(config) + ";\n", encoding="utf-8")'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
